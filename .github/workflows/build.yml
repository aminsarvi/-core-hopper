name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Create Web Root and Move Files
        run: |
          mkdir -p www
          cp index.html www/
          if [ -d "assets" ]; then cp -r assets www/; fi
          if [ -f "icon.ico" ]; then cp icon.ico www/; fi

      - name: Install Capacitor & Android Platform
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "CoreHopper" "com.corehopper.game" --web-dir www
          npx cap add android

      - name: Apply App Icon
        run: |
          # پیدا کردن فایل عکس (چه png چه ico)
          SRC_IMG=""
          if [ -f "icon.png" ]; then
            SRC_IMG="icon.png"
          elif [ -f "icon.ico" ]; then
            SRC_IMG="icon.ico"
          fi

          if [ -n "$SRC_IMG" ]; then
            sudo apt-get update && sudo apt-get install -y imagemagick
            
            # تبدیل به تمام سایزهای پیش‌فرض اندروید
            convert "$SRC_IMG[0]" -resize 48x48   android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert "$SRC_IMG[0]" -resize 48x48   android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
            convert "$SRC_IMG[0]" -resize 72x72   android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert "$SRC_IMG[0]" -resize 72x72   android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            convert "$SRC_IMG[0]" -resize 96x96   android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert "$SRC_IMG[0]" -resize 96x96   android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
            convert "$SRC_IMG[0]" -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert "$SRC_IMG[0]" -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            convert "$SRC_IMG[0]" -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            convert "$SRC_IMG[0]" -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
            
            # تنظیم آیکون انطباقی (Foreground)
            convert "$SRC_IMG[0]" -resize 432x432 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
            cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
            cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
            cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
            cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
          fi

      - name: Configure Fullscreen & Hide Bars
        run: |
          sed -i 's/<style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">/<style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">\n        <item name="android:windowFullscreen">true<\/item>\n        <item name="android:windowContentOverlay">@null<\/item>/' android/app/src/main/res/values/styles.xml
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoreHopper-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
